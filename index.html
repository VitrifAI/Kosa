<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOSA: A Philippine jail simulator</title>
<meta name="description" content="A pixel simulator about surviving the Philippine jail system and trying to get out early.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Jersey+15&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#cfe0d4;--bg-deep:#b6cdbd;--surface:#eef4ef;--surface-2:#e0ebe3;
  --manila:#e9d39b;--ink:#1c2a22;--ink-soft:#495c50;--line:#1c2a22;--shadow:#1c2a22;
  --stamp:#b3261e;--ok:#276636;--amber-fill:#f2b134;--ball:#1f3f95;
  --btn:#f7faf7;--primary:#1c2a22;--primary-ink:#f3efe2;--meter-off:#c2d5c7;--veil:rgba(12,20,15,.62);
  --font-pix:"Jersey 15","Atkinson Hyperlegible",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121a16;--bg-deep:#0b110e;--surface:#1a251f;--surface-2:#213029;
    --manila:#3e3521;--ink:#ece5d0;--ink-soft:#b3c1b7;--line:#ece5d0;--shadow:#000;
    --stamp:#ff7466;--ok:#82dc96;--amber-fill:#f2b134;--ball:#a3bcff;
    --btn:#203029;--primary:#f2b134;--primary-ink:#1a1408;--meter-off:#2b3a33;--veil:rgba(0,0,0,.68);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121a16;--bg-deep:#0b110e;--surface:#1a251f;--surface-2:#213029;
  --manila:#3e3521;--ink:#ece5d0;--ink-soft:#b3c1b7;--line:#ece5d0;--shadow:#000;
  --stamp:#ff7466;--ok:#82dc96;--amber-fill:#f2b134;--ball:#a3bcff;
  --btn:#203029;--primary:#f2b134;--primary-ink:#1a1408;--meter-off:#2b3a33;--veil:rgba(0,0,0,.68);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg-deep)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ball)}
:focus-visible{outline:3px solid var(--amber-fill);outline-offset:2px}
p{margin:0 0 10px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg-deep);border-bottom:3px solid var(--line)}
.brand{font-family:var(--font-pix);font-weight:700;font-size:22px;letter-spacing:2px}
.clock{flex:1;min-width:0}
.day{font-family:var(--font-pix);font-size:17px;line-height:1.1}
.date{font-size:12.5px;color:var(--ink-soft)}
.speed{display:flex;gap:4px}
.sp{min-width:38px;height:38px;padding:0 6px;border:2px solid var(--line);background:var(--btn);font-family:var(--font-pix);font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.sp[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.sp:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
body:not([data-screen="game"]) .speed{display:none}
body:not([data-screen="game"]) .clock>*{display:none}

/* layout */
main{max-width:1120px;margin:0 auto;padding:14px 12px 32px}
.h1{font-family:var(--font-pix);font-size:clamp(28px,6vw,44px);line-height:1.05;margin:6px 0 10px}
.h2{font-family:var(--font-pix);font-size:22px;margin:22px 0 10px}
.lede{font-size:17px;max-width:62ch}
.muted{color:var(--ink-soft);font-size:14px}
.note{font-size:13.5px;color:var(--ink-soft);max-width:56ch}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border:2px solid var(--line);background:var(--btn);box-shadow:3px 3px 0 var(--shadow);font-family:var(--font-pix);font-size:16px;line-height:1.2;text-align:left}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}

/* title */
.title-screen{display:grid;gap:20px;align-items:center;padding-top:8px}
@media (min-width:860px){.title-screen{grid-template-columns:1.15fr 1fr}}
.logo-big{font-family:var(--font-pix);font-weight:700;font-size:clamp(76px,20vw,150px);line-height:.85;margin:0 0 14px;letter-spacing:6px;text-shadow:6px 6px 0 var(--amber-fill)}

/* scene */
.scene{margin:0;border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);background:#0d1410}
.scene canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:crisp-edges;image-rendering:pixelated}
.scene figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:6px 10px;background:var(--surface);color:var(--ink);border-top:3px solid var(--line);font-size:13.5px}
.scene figcaption b{font-family:var(--font-pix);font-weight:600}

/* game */
.game{display:grid;gap:16px}
@media (min-width:920px){.game{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}}
.col-left{display:grid;gap:12px;align-content:start}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.meter{background:var(--surface);border:2px solid var(--line);padding:6px 8px;min-width:0}
.meter .lab{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:12.5px}
.meter .lab b{font-family:var(--font-pix);font-weight:600;font-size:15px;white-space:nowrap}
.meter .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.bar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;margin-top:5px;height:8px}
.bar i{background:var(--meter-off)}
.bar i.on{background:var(--ink)}
.bar.low i.on{background:var(--stamp)}

/* case folder */
.folder{position:relative;background:var(--manila);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:14px 14px 12px;margin-top:22px;overflow:visible}
.folder::before{content:attr(data-tab);position:absolute;top:-24px;left:-3px;height:24px;line-height:20px;padding:0 10px;background:var(--manila);border:3px solid var(--line);border-bottom:none;font-family:var(--font-pix);font-size:13px;white-space:nowrap}
.f-label{font-size:12px;color:var(--ink-soft)}
.f-big{font-family:var(--font-pix);font-size:20px;line-height:1.15;padding-right:70px}
.f-small{font-size:12.5px;color:var(--ink-soft)}
.f-val{font-family:var(--font-pix);font-size:16px;line-height:1.2}
.f-val.small{font-size:14px}
.f-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-top:10px}
.f-num{font-family:var(--font-pix);font-size:34px;line-height:1;color:var(--stamp)}
.tick-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;max-width:100%}
.tick-row i{display:block;width:3px;height:12px;background:var(--stamp)}
.tick-row i:nth-child(5n){margin-right:5px}
.steps{list-style:none;padding:0;margin:12px 0 4px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.steps li{font-size:11px;text-align:center;padding:4px 1px;border:2px solid var(--line);line-height:1.15;overflow-wrap:anywhere}
.steps li.done{background:var(--ink);color:var(--manila)}
.steps li.now{background:var(--amber-fill);color:#1a1408}
.stamp{position:absolute;right:8px;top:6px;font-family:var(--font-pix);font-weight:700;font-size:26px;line-height:1;color:var(--stamp);border:4px solid currentColor;padding:4px 10px;transform:rotate(-11deg);opacity:0;pointer-events:none;background:transparent}
.stamp.ok{color:var(--ok)}
.stamp.show{animation:thunk 2.4s steps(1) forwards}
@keyframes thunk{0%{opacity:0;transform:rotate(-11deg) scale(1.7)}6%{opacity:1;transform:rotate(-11deg) scale(1.2)}12%{opacity:1;transform:rotate(-11deg) scale(1)}85%{opacity:1}100%{opacity:0;transform:rotate(-11deg) scale(1)}}

/* tabs and panel */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:-3px;position:relative;z-index:1}
.tabs button{border:3px solid var(--line);background:var(--surface-2);padding:7px 2px 6px;font-family:var(--font-pix);font-size:14px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.tabs button small{display:block;font-family:var(--font-body);font-size:11px;color:var(--ink-soft);margin-top:2px}
.tabs button[aria-selected="true"]{background:var(--surface);border-bottom-color:var(--surface)}
.panel{background:var(--surface);border:3px solid var(--line);padding:14px;box-shadow:4px 4px 0 var(--shadow);min-height:320px}
.panel h3{font-family:var(--font-pix);font-weight:600;font-size:17px;margin:20px 0 8px}
.panel h3:first-child{margin-top:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--btn);border:2px solid var(--line);padding:8px 10px;min-height:56px}
.opt b{font-family:var(--font-pix);font-weight:600;font-size:15px;line-height:1.2}
.opt span{font-size:13px;color:var(--ink-soft)}
.opt[aria-pressed="true"]{background:var(--manila);box-shadow:inset 0 0 0 2px var(--line)}
.opt[disabled]{opacity:.55;cursor:not-allowed}
.acts{display:grid;gap:8px}
.act{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--btn);border:2px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:10px 12px;min-height:48px}
.act b{font-family:var(--font-pix);font-weight:600;font-size:15px;line-height:1.25}
.act span{font-size:13px;color:var(--ink-soft)}
.act[disabled]{box-shadow:none;opacity:.62;cursor:not-allowed}
.act.locked{border-style:dashed;box-shadow:none;background:transparent}
.kv{background:var(--surface-2);border:2px solid var(--line);padding:10px 12px;font-size:14px;margin-bottom:6px}
.kv p{margin:0 0 4px}
.kv p:last-child{margin:0}
.est{font-size:14px;background:var(--surface-2);border-left:6px solid var(--ink-soft);padding:8px 10px}
.status p{margin:0 0 8px;padding:8px 10px;border-left:6px solid var(--stamp);background:var(--surface-2);font-size:14px}
.tip{background:var(--manila);border:2px solid var(--line);padding:10px 12px;margin-bottom:12px}
.tip b{font-family:var(--font-pix)}
.tip p{margin:4px 0 0;font-size:14.5px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.log li{font-size:14px;padding:6px 8px;border-left:5px solid var(--ink-soft);background:var(--surface-2)}
.log .d{display:block;font-family:var(--font-pix);font-size:12px;color:var(--ink-soft)}
.log .k-case{border-left-color:var(--ball)}
.log .k-bad{border-left-color:var(--stamp)}
.log .k-good{border-left-color:var(--ok)}
.log .k-money{border-left-color:var(--amber-fill)}
.log .k-talk{border-left-style:dashed}
.facts,.simple{padding-left:20px;margin:0;display:grid;gap:10px;font-size:14.5px}
.facts .src{display:block;font-size:12.5px;color:var(--ink-soft)}
.terms,.rights{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:6px 12px;font-size:14.5px;margin:0}
.terms dt,.rights dt{font-weight:700}
.terms dd,.rights dd{margin:0}
@media (max-width:420px){.rights{grid-template-columns:1fr}.rights dd{margin-bottom:6px}}

/* facts */
.fact{border-left:6px solid var(--ball);background:var(--surface-2);padding:8px 10px;margin:10px 0;font-size:14px;max-width:70ch}
.fact b{font-family:var(--font-pix);font-weight:600}
.fact .src{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-soft)}

/* court */
.who{display:grid;gap:12px;margin:16px 0 4px}
@media (min-width:640px){.who{grid-template-columns:1.4fr 1fr}}
.field{display:grid;gap:4px;align-content:start}
.field>span{font-weight:700;font-size:14px}
.field input{font:inherit;padding:10px 12px;border:2px solid var(--line);background:var(--btn);color:var(--ink);min-height:46px;width:100%}
.seg{display:flex;gap:8px}
.seg .btn{flex:1;justify-content:center}
.seg .btn[aria-pressed="true"]{background:var(--manila)}
.cases{display:grid;gap:12px}
@media (min-width:760px){.cases{grid-template-columns:1fr 1fr}}
.case{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:3px solid var(--line);box-shadow:3px 3px 0 var(--shadow);padding:12px 14px}
.case[aria-pressed="true"]{background:var(--manila);box-shadow:6px 6px 0 var(--shadow)}
.case-title{font-family:var(--font-pix);font-weight:600;font-size:20px;line-height:1.1}
.case-sub{font-size:14px;color:var(--ink-soft);margin-top:-4px}
.case-law{font-size:12.5px;color:var(--ball)}
.case-story{font-size:14.5px}
.case-dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;border-top:2px dashed var(--ink-soft);padding-top:8px}
.case-dl .dt{font-weight:700}
.sticky-go{position:sticky;bottom:0;padding:12px 0;margin-top:12px;background:var(--bg)}
.sticky-go .btn{width:100%;justify-content:center}

/* ending */
.ending h1{font-family:var(--font-pix);font-size:clamp(46px,12vw,86px);line-height:.95;margin:8px 0 4px}
.ending.tone-good h1{color:var(--ok)}
.ending.tone-bad h1{color:var(--stamp)}
.end-sub{font-family:var(--font-pix);font-size:20px;color:var(--ink-soft)}
.end-case{font-size:14px;color:var(--ink-soft);margin:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}
@media (min-width:700px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--surface);border:2px solid var(--line);padding:8px 10px}
.stat b{display:block;font-family:var(--font-pix);font-size:19px;line-height:1.15}
.stat span{font-size:13px;color:var(--ink-soft)}
.callout{border:3px dashed var(--stamp);padding:10px 12px;max-width:70ch}
.ending h1.qmark{font-family:var(--font-pix);font-weight:700;font-size:clamp(130px,36vw,230px);line-height:.8;margin:18px 0 0;color:var(--ink);text-shadow:8px 8px 0 var(--amber-fill)}
.end-q{font-family:var(--font-pix);font-size:clamp(26px,6vw,36px);line-height:1.1;margin:10px 0 8px}
.ending .scene.gate{max-width:620px;margin-top:6px}
.packet{list-style:none;padding:0;margin:0;display:grid;gap:8px;max-width:72ch}
.packet li{background:var(--surface);border:2px solid var(--line);padding:8px 12px;font-size:15px}
.course{display:grid;gap:6px;background:var(--surface-2);border:2px solid var(--line);padding:10px 12px;margin-bottom:8px}
.course b{font-family:var(--font-pix);font-weight:600}
.course span{font-size:13px;color:var(--ink-soft)}
.certs{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.certs li{display:grid;gap:2px;border-left:6px solid var(--ok);background:var(--surface-2);padding:6px 10px;font-size:14px}
.certs li span{font-size:12.5px;color:var(--ink-soft)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:end center;background:var(--veil);padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal{place-items:center}}
.modal[hidden]{display:none}
.mcard{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:3px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--manila);border-bottom:3px solid var(--line)}
.mhead h2{font-family:var(--font-pix);font-size:22px;line-height:1.1;margin:0;flex:1}
.micon{font-size:24px;line-height:1}
.mday{font-family:var(--font-pix);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.mbody{padding:14px 14px 4px}
.mbody p{max-width:62ch}
.mact{display:grid;gap:8px;padding:6px 14px 16px}
.mact .btn{width:100%;justify-content:flex-start}
.delta{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.delta span{font-family:var(--font-pix);font-size:13px;padding:2px 7px;border:2px solid currentColor}
.delta .up{color:var(--ok)}
.delta .down{color:var(--stamp)}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;justify-items:center;gap:6px;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast{width:min(520px,100%);background:var(--ink);color:var(--bg);padding:8px 12px;border:2px solid var(--line);font-size:14px;box-shadow:3px 3px 0 var(--shadow)}

/* ---------- version 4 ---------- */
.tabs{grid-template-columns:repeat(6,minmax(0,1fr))}
.tabs button::before{display:block;font-size:15px;line-height:1;margin-bottom:3px;font-family:var(--font-body)}
.tabs button[data-tab="araw"]::before{content:"\2600\FE0E"}
.tabs button[data-tab="kaso"]::before{content:"\2696\FE0E"}
.tabs button[data-tab="selda"]::before{content:"\25A6"}
.tabs button[data-tab="kosa"]::before{content:"\2665\FE0E"}
.tabs button[data-tab="talaan"]::before{content:"\270E"}
.tabs button[data-tab="totoo"]::before{content:"\2714\FE0E"}
@media (max-width:919px){
  body[data-screen="game"] main{padding-bottom:96px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;gap:0;background:var(--bg-deep);border-top:3px solid var(--line);padding:2px 2px calc(2px + env(safe-area-inset-bottom,0px))}
  .tabs button{border:none;background:transparent;padding:6px 0 5px;font-size:12px}
  .tabs button small{display:none}
  .tabs button[aria-selected="true"]{background:var(--surface);box-shadow:inset 0 -4px 0 var(--amber-fill)}
  body[data-screen="game"] .toasts{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
.portrait{width:48px;height:48px;image-rendering:crisp-edges;image-rendering:pixelated;border:2px solid var(--line);flex:none;display:block}
.micon .portrait{width:44px;height:44px}
.npc{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:2px solid var(--line);padding:10px;margin-bottom:8px}
.npc-main{display:grid;gap:2px;min-width:0;flex:1}
.npc-main b{font-family:var(--font-pix);font-weight:600;font-size:16px}
.npc-role,.npc-perk{font-size:13px;color:var(--ink-soft)}
.hearts{color:#e63973;font-size:16px;letter-spacing:2px}
.hearts i{color:var(--meter-off);font-style:normal}
.npc-act{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mini{min-height:38px;padding:4px 10px;border:2px solid var(--line);background:var(--btn);font-family:var(--font-pix);font-size:13px;box-shadow:2px 2px 0 var(--shadow)}
.mini[aria-pressed="true"]{background:var(--manila)}
.mini[disabled]{opacity:.5;box-shadow:none;cursor:not-allowed}
.goals{background:var(--manila);border:2px solid var(--line);padding:10px 12px;margin-bottom:14px}
.goals b{font-family:var(--font-pix);font-weight:600}
.goal{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin-top:7px;font-size:14.5px}
.goal i{font-style:normal}
.goal span{grid-column:2;font-size:12.5px;color:var(--ink-soft)}
.cal{font-size:13.5px;margin:9px 0 0}
.meter{position:relative}
.pop{position:absolute;right:6px;top:-6px;font-family:var(--font-pix);font-size:13px;pointer-events:none;animation:floatup 1.2s ease-out forwards}
.pop.up{color:var(--ok)}
.pop.down{color:var(--stamp)}
@keyframes floatup{0%{opacity:0;transform:translateY(6px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.shake{animation:shake .32s steps(4)}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,1px)}50%{transform:translate(3px,-1px)}75%{transform:translate(-2px,0)}100%{transform:translate(0,0)}}
.mcard.lucky{border-color:#b8860b;box-shadow:6px 6px 0 #b8860b}

const FACTS = {
  congestion: { t: "BJMP jails held 281% more people than they were built for as of August 2026. Some single jails have passed 1,000%.", src: "Daily Tribune, Sept. 2026; GMA News", url: "https://tribune.net.ph/2026/09/21/jail-congestion-eases-but-remains-at-281" },

  drugs: { t: "About 7 in 10 people in BJMP jails face drug cases, mostly small-time users and sellers.", src: "ABS-CBN News, Dec. 2023", url: "https://abs-cbn.com/news/12/02/23/most-pdls-in-jail-for-drugs-are-small-time-peddlers-users" },
  fiveyears: { t: "In October 2023, nearly 10,000 people had been in jail on trial for five years or more. Most were drug defendants.", src: "Rappler", url: "https://www.rappler.com/newsbreak/investigative/duterte-drug-war-pushes-prisons-breaking-point/" },
  bail: { t: "State auditors found in 2018 that poor detainees stayed in jail because they couldn’t afford bail, even when bail was allowed.", src: "Commission on Audit, via Asia News Network", url: "https://asianews.network/?p=259437" },
  bailhearing: { t: "Bail hearings take at least 120 days on average. Some drag on for 3 to 6 years.", src: "Raymund Narag, criminologist", url: NARAG },
  food: { t: "The 2026 budget gives each PDL ₱100 a day for food and ₱20 for medicine, up from ₱70 and ₱15.", src: "Manila Bulletin, Jan. 2026", url: "https://mb.com.ph/2026/01/14/increase-in-food-medicine-allowance-for-pdls-geared-toward-humane-treatment-yamsuan" },
  caterer: { t: "State auditors reported that BuCor’s caterer served food with less nutrition, and in smaller amounts, than agreed.", src: "Philippine Daily Inquirer", url: "https://newsinfo.inquirer.net/1811992/pdls-kin-can-now-order-food-delivery-to-bilibid/amp" },
  resets: { t: "Hearings come every 2 to 3 months, then often get postponed: no escort, no internet, no judge, or a lawyer with another hearing. Lawyers are paid per appearance either way.", src: "Raymund Narag, criminologist", url: NARAG },
  paamin: { t: "After 2 to 3 years in jail, most PDLs plead guilty to a lower offense just to get out. They become convicts who were never tried.", src: "Raymund Narag, criminologist", url: NARAG },
  pao: { t: "Each public attorney handles about 350 cases a month. There’s about one PAO lawyer for every two courts.", src: "Daily Tribune, Aug. and Oct. 2026", url: "https://tribune.net.ph/2026/08/28/pao-seeks-p700-m-budget" },
  plea: { t: "People charged with selling 0.01 to 0.99 gram of shabu can plea-bargain to possessing drug paraphernalia, which carries 6 months and 1 day to 4 years.", src: "Supreme Court Plea Bargaining Framework; People v. Montierro (2022)", url: "https://lawphil.net/judjuris/juri2022/jul2022/pdf/gr_254564_2022.pdf" },
  probation: { t: "The Supreme Court has said a person who plea-bargains a drug sale charge down to Section 12 can apply for probation.", src: "Supreme Court, G.R. No. 259728 (2023)", url: "https://sc.judiciary.gov.ph/wp-content/uploads/2023/03/259728.pdf" },
  gcta: { t: "Good conduct time allowance cuts 20 to 30 days a month from a sentence. In 2024, the Supreme Court said people convicted of heinous crimes qualify too.", src: "RA 10592; Supreme Court, Guinto v. DOJ (2024)", url: "https://sc.judiciary.gov.ph/?p=121415" },
  gctasale: { t: "In 2019, senators heard that GCTA was being sold in Bilibid. One woman said she paid ₱50,000 for her partner’s release, which never came.", src: "Philippine Star, Sept. 2019", url: "https://www.philstar.com/headlines/2019/09/12/1951206/headlines" },
  surrender: { t: "In 2019, the President ordered 1,914 heinous-crime convicts released under GCTA to surrender within 15 days.", src: "Philippine Star, Sept. 2019", url: "https://www.philstar.com/headlines/2019/09/07/1949663/gcta-sale-bared" },
  hospital: { t: "A 2019 Senate inquiry also heard that hospital passes were for sale in Bilibid.", src: "Philippine Star, Sept. 2019", url: "https://www.pressreader.com/philippines/the-philippine-star/20190910/281487868040749" },
  recog: { t: "Under RA 10389, a poor accused can be released on recognizance unless the charge carries death, reclusion perpetua, or life. Anyone held as long as the minimum penalty must be released on recognizance.", src: "RA 10389, the Recognizance Act of 2012", url: "https://elibrary.judiciary.gov.ph/thebookshelf/showdocs/2/53626" },
  mayores: { t: "Many jails run on an inmate-leader system. The mayores heads the cell, the bastonero enforces rules, and a “jury” decides punishments. Wardens rely on it because they lack guards.", src: "Philippine Daily Inquirer, 2018", url: "https://newsinfo.inquirer.net/1023396/gang-leaders-keep-peace-order-in-undermanned-underfunded-jails/amp" },
  recruit: { t: "A former BuCor chief said gang recruitment starts in BJMP jails, usually within a month of arrival.", src: "Manila Bulletin, Dec. 2018", url: "https://mb.com.ph/2018/12/27/12-bilibid-gangs-dissolved-peace-order-pact-inked" },
  querna: { t: "In 2019, only about 2,300 of the 19,600 people in Bilibid’s maximum security compound were “querna,” meaning not in any gang.", src: "Philippine Daily Inquirer", url: "https://newsinfo.inquirer.net/1067029/nbps-biggest-compound-now-gang-free" },
  kubol: { t: "In 2023, BuCor demolished nearly 3,000 kubols in Bilibid. Some inmate leaders had their own phones, routers, TVs, and air coolers.", src: "GMA News, 2023", url: "https://gmanetwork.com/news/topstories/nation/881198/bucor-dismantles-nearly-3-000-bilibid-cubicles/story" },

/* KOSA engine. State, time, and case logic. No DOM code here, so it can be tested in Node. */

/* ---------- small helpers ---------- */
const R = Math.random;
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const chance = p => R() < p;
const pick = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const peso = n => "₱" + Math.round(n).toLocaleString("en-US");
function recent(key, days) { const v = S.flags[key]; return v !== undefined && v !== null && v !== false && S.day - v < days; }
function dateOf(day) { const d = new Date(S.start + "T00:00:00"); d.setDate(d.getDate() + day); return d; }
function fmtDate(day) { const d = dateOf(day); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; }
function month(s) { return dateOf((s || S).day).getMonth(); }
function dom(s) { return dateOf((s || S).day).getDate(); }
function isHot(s) { const m = month(s); return m >= 2 && m <= 4; }
function isRainy(s) { const m = month(s); return m >= 5 && m <= 10; }
function age(s) { s = s || S; return s.age0 + Math.floor(s.day / 365); }
function daysIn(s) { s = s || S; return s.day - (s.tot.outside || 0); }
function cs() { return CASES[S.caseId]; }
function fc() { return FAC[S.fac]; }
function dur(days) {
  days = Math.max(0, Math.round(days));
  const y = Math.floor(days / 365), m = Math.floor((days % 365) / 30), d = (days % 365) % 30, p = [];
  if (y) p.push(y + (y === 1 ? " year" : " years"));
  if (m) p.push(m + (m === 1 ? " month" : " months"));
  if (!y && (d || !m)) p.push(d + (d === 1 ? " day" : " days"));
  return p.join(", ");
}
function facName(s) {
  s = s || S; const f = FAC[s.fac];
  if (s.sex === "f") {
    if (s.fac === "city") return f.name + ", Female Dormitory";
    if (s.fac === "prov") return f.name + ", Women’s Wing";
    if (s.fac === "iwahig") return "CIW Sta. Lucia, Iwahig";
  }
  if (s.fac === "nbp" && s.sub) return f.name + ({ rdc: ", Reception and Diagnostic Center", max: ", Maximum Security", med: ", Medium Security" })[s.sub];
  return f.name;
}

// Fills in fields added in later versions, so old saves keep working after updates.
function hydrate(saved) {
  if (!saved || !CASES[saved.caseId]) return null;
  const base = freshState({ name: saved.name, sex: saved.sex, caseId: saved.caseId });
  const merge = (b, s) => {
    for (const k in b) {
      if (s[k] === undefined) s[k] = b[k];
      else if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k]) && s[k] && typeof s[k] === "object" && !Array.isArray(s[k])) merge(b[k], s[k]);
    }
    return s;
  };
  return merge(base, saved);
}
function saveGame() { if (!S) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: SAVE_VERSION, S })); } catch (e) { /* storage may be unavailable */ } }
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY); if (!raw) return null;
    const o = JSON.parse(raw); if (!o || !o.S || o.S.ended) return null;
    const s = hydrate(o.S);
    // Version 2 replaced the old one-step TESDA flag with real certificates.
    if (s && (o.v || 1) < 2 && s.flags.tesda && !s.tesda.certs.length) s.tesda.certs.push({ id: s.sex === "f" ? "bread" : "weld", day: s.day, exp: s.day + yd(5) });

  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } }

function add(k, n) {

  S.st[k] = clamp(S.st[k] + n, 0, 100);
  if (k === "hp") S.tot.minHp = Math.min(S.tot.minHp, S.st.hp);
}
function gain(n) { add("cash", n); }
function spend(n, kind) { n = Math.max(0, Math.min(Math.round(n), S.st.cash)); S.st.cash -= n; const k = kind || "other"; S.tot[k] = (S.tot[k] || 0) + n; return n; }
function log(t, k) { S.log.unshift({ d: S.day, t, k: k || "life" }); if (S.log.length > 180) S.log.length = 180; }
function know(key) {

function infraction(n) { add("rec", -n); S.flags.inf = true; S.tot.infractions++; if (S.meta) S.meta.lastInf = S.day; }
function bartolina(d) { S.bart = Math.max(S.bart || 0, S.day + d); S.flags.inf = true; log(`You were sent to the bartolina for ${d} days.`, "bad"); }

}
function moveTo(f, sub) {

function randomEvent() {

    if (e.once && S.seen[e.id]) continue;
    if (e.cd && S.cool[e.id] !== undefined && S.day - S.cool[e.id] < e.cd) continue;
    const w = typeof e.w === "function" ? e.w(S) : e.w;
    if (w > 0) pool.push([e, w]);
  }
  if (!pool.length) return;
  let x = R() * pool.reduce((a, p) => a + p[1], 0);

}

    return `It works. Your share is ${peso(loot)}. ${H.win}`;
  }
  infraction(35); bartolina(30); add("hp", -8); newCase("You were caught stealing inside.");
  const crew = CREW[h.crew];
  if (crew && crew.betray && chance(crew.betray)) { add("resp", -6); return "Bunso talks first. You’re caught, and you’re the one named in the report."; }
  return "A guard you didn’t pay was on duty. You’re caught with the goods.";
}

const Game = {
  start(o) { S = freshState(o); Q.length = 0; startArrest(); metaStart(); ensurePending(); saveGame(); },
  load() { const s = loadSave(); if (!s) return false; S = s; Q.length = 0; ensurePending(); return true; },

"use strict";
/* KOSA systems, version 3: the police lockup, bail and debts, bondsmen, contraband,
   kubol plans, gang missions, and kosa talk. No DOM code here, so it can be tested in Node. */

function sys() {
  if (!S.sys) S.sys = { pre: null, bail: null, debts: [], sold: [], sales: [], asked: [], poorer: 0, homeSold: false, walked: 0,
    stash: { yosi: 0, alak: 0, bold: 0, phone: 0 }, heat: 0, ship: null, smug: null, kubol: null, hike: 1 };
  return S.sys;
}

/* ---------- arrest and the police lockup ---------- */
function startArrest() {
  const s = sys(), c = cs();
  S.fac = "presinto"; S.facSince = 0; S.kaso.next = null;
  s.pre = { lawyer: null, waiver: null, until: ri(4, 18), excuses: 0, overdue: false, gone: false, called: false, chr: false, pi: false, extortAsked: false, done: false };
  S.flags.arrest = true;
  log(`Day 0. You were arrested and taken to the police station. The blotter says ${c.sub.toLowerCase()}.`, "case");
}
function systemsPending() {
  if (S.flags.arrest && S.sys && S.sys.pre && !S.sys.pre.done) { queue(arrestItem()); return true; }
  return false;
}
function arrestItem() {
  const c = cs(), p = sys().pre;
  return { key: "arrest", title: "Huli ka!", icon: "🚓", fact: "art125",
    text: `The police book you: fingerprints, a mugshot, and a name card on your chest. The blotter says ${c.sub.toLowerCase()}. Your cousin calls the desk phone. A lawyer named Atty. Ramos can take your case now for ₱5,000, “for the inquest.”`,
    choices: [
      { t: "Have your family pay Atty. Ramos ₱5,000", ok: S.st.fam >= 20, fx: () => { S.flags.arrest = false; p.lawyer = "ramos"; add("fam", -6); S.tot.lawyer += 5000; later(1, "pre_waiver"); know("art125"); return `He arrives in a pressed barong. “Relax. Within ${c.limit} hours, you’ll be brought before the authorities. That’s the law.” Then he leaves to “talk to the fiscal.”`; } },
      { t: "Wait for the PAO lawyer on inquest duty", ok: true, fx: () => { S.flags.arrest = false; p.lawyer = "pao"; later(1, "pre_waiver"); return "The desk officer says the PAO lawyer covers six stations today. She’ll come “mamaya.” (Later.)"; } },
    ] };
}
function dropChance() { const c = cs(); return clamp((40 - (c.ev - c.def)) / 200, 0.02, 0.15); }
function presintoDaily() {
  const s = sys(), p = s.pre; if (!p || p.done || S.flags.arrest) return;
  const c = cs(), hours = S.day * 24;
  if (!p.overdue && hours > c.limit) {
    p.overdue = true; UI.stamp("lampas");
    log(`${hours} hours have passed. The legal limit for your charge is ${c.limit}. Nobody seems to mind.`, "case");
    UI.toast(`Past the ${c.limit}-hour limit. Still no judge.`);
  }
  if (chance(0.55)) { const ex = pick(EXCUSES); p.excuses++; log(ex, "case"); if (chance(0.4)) UI.toast(ex); }
  if (S.day >= 2 && p.lawyer === "ramos" && !p.gone) { p.gone = true; queueEvent("pre_gone"); }
  if (S.day >= 2 && !S.seen.pre_rumor) queueEvent("pre_rumor");
  if (S.day >= 3 && !p.extortAsked && chance(0.25)) { p.extortAsked = true; queueEvent("pre_extort"); }
  if (S.day >= p.until) {
    if (p.waiver && !p.pi) { p.pi = true; if (chance(dropChance())) { p.done = true; release("dropped"); return; } }
    queueEvent("pre_commit");
  }
}
function commitNow() {
  const s = sys(), p = s.pre, c = cs();
  if (!p || p.done) return "";
  p.done = true; S.flags.arrest = false; S.tot.lockupHours = S.day * 24;
  moveTo(c.fac);
  S.kaso.next = S.day + ri(20, 55);
  S.flags.intake = true;
  if (c.bailable) s.bail = { amt: c.bailAmt, set: S.day, motion: false, motions: 0 };
  log(`After ${S.tot.lockupHours} hours, the court issued a commitment order.`, "case");
  return `The van takes you to ${facName()}.`;
}
function presintoActions() {
  const p = sys().pre;
  return [
    { id: "preAsk", group: "At the station", t: "Ask the desk officer about your inquest", ok: !recent("preAsk", 1), why: "You already asked today.",
      run: () => { S.flags.preAsk = S.day; p.excuses++; add("hope", -1); return `He doesn’t look up. ${pick(EXCUSES)}`; } },
    { id: "preGrease", group: "At the station", t: "Give the desk officer ₱1,000 for “pang-kape”", ok: S.st.cash >= 1000, why: "You need ₱1,000.",
      run: () => { spend(1000, "lagay"); if (chance(0.5)) { p.until = Math.max(S.day + 1, p.until - ri(2, 5)); return "Your folder moves to the top of the pile. Maybe."; } return "He takes it. Nothing changes."; } },
    { id: "preCHR", group: "At the station", t: "Have your family complain to the CHR", ok: S.st.fam >= 30 && !p.chr, why: p.chr ? "Your family already complained." : "Your family can’t follow up right now (needs Family 30).",
      run: () => { p.chr = true; add("fam", -3); if (chance(0.35)) { p.until = Math.min(p.until, S.day + 1); return "A CHR investigator visits the station. Suddenly, your inquest is tomorrow."; } return "Your family files a complaint. Nobody calls back."; } },
  ];

/* ---------- bail ---------- */
function bailAmount() { const b = S.sys && S.sys.bail; return (b && b.amt) || cs().bailAmt; }
function ensureBail() { const s = sys(); if (!s.bail) s.bail = { amt: cs().bailAmt, set: S.day, motion: false, motions: 0 }; return s.bail; }
function bailLine() {
  const c = cs(), k = S.kaso;
  if (S.fac === "presinto") return "Not set yet. The court sets it after your case is filed.";
  if (!c.bailable && !k.bailOK) return c.bailText;
  const amt = bailAmount();
  return `${peso(amt)}, set by the judge. You have ${peso(S.st.cash)}${S.st.cash < amt ? `, so you’re short by ${peso(amt - S.st.cash)}` : ""}.`;
}
function hasTitle() { const a = cs().assets || []; return a.includes("lot") && !sys().sold.includes("lot"); }
function famFactor() { return Math.max(0.25, 1 - 0.25 * ((S.sys && S.sys.poorer) || 0)); }
function totalDebt() { return S.sys ? S.sys.debts.reduce((a, d) => a + Math.max(0, d.owed), 0) : 0; }
function unsoldAssets() { const s = sys(); return (cs().assets || []).filter(id => !s.sold.includes(id)); }
function bailActions() {
  const b = ensureBail(), k = S.kaso, amt = b.amt, A = [];
  A.push({ id: "bailCash", group: "Bail", t: `Post bail in cash (${peso(amt)})`, ok: S.st.cash >= amt, why: `You have ${peso(S.st.cash)}. You’re short by ${peso(Math.max(0, amt - S.st.cash))}.`,
    run: () => { postBail("cash"); return "Your family counts the money twice and hands it to the clerk. You’re released that afternoon."; } });
  A.push({ id: "bailSell", group: "Bail", t: "Sell family property", ok: unsoldAssets().length > 0, why: "Your family has nothing left to sell.", run: () => { queueSell(); return ""; } });
  A.push({ id: "bailBorrow", group: "Bail", t: "Borrow from people you know", ok: lenders().length > 0 && !recent("borrow", 7),
    why: lenders().length ? "Give it a week before you ask someone else." : "You’ve asked everyone you know.", run: () => { queueBorrow(); return ""; } });
  A.push({ id: "bailBond", group: "Bail", t: "Talk to a bondsman", ok: !b.bondCheck, why: "Your lawyer is still checking the bonding company.", run: () => { queueBondsman(); return ""; } });
  A.push({ id: "bailReduce", group: "Bail", t: "Ask the court to lower your bail", ok: !b.motion && k.stage >= 1 && !recent("reduceDenied", 180),
    why: b.motion ? "Your motion will be heard at your next hearing." : k.stage < 1 ? "Wait until after your arraignment." : "It was denied recently. Try again later.",
    run: () => { b.motion = true; log("Your lawyer asked the court to lower your bail.", "case"); return "Your motion will be heard at your next hearing that pushes through."; } });
  if (totalDebt() > 0) A.push({ id: "payDebt", group: "Bail", t: `Pay back what you owe (${peso(totalDebt())})`, ok: S.st.cash > 0, why: "You have no money.", run: () => payDebts() });
  return A;
}
function bailReduceDecision() {
  const b = S.sys.bail; b.motion = false; b.motions++;
  if (chance(0.4 + (LAWYERS[S.kaso.lawyer].q >= 3 ? 0.1 : 0))) {
    const old = b.amt; b.amt = Math.max(1000, Math.round(b.amt * (0.5 + R() * 0.2) / 1000) * 1000);
    log(`The judge lowered your bail from ${peso(old)} to ${peso(b.amt)}.`, "case");
    info("bailDown", "Bail lowered", "⚖️", `The judge lowers your bail from ${peso(old)} to ${peso(b.amt)}. ${S.st.cash < b.amt ? "It’s still more than you have." : "You can post it now."}`, "bail");

}

/* selling property */
function queueSell() {
  queue({ key: "sell", title: "Ibenta", icon: "🏷️", fact: null, text: "What can your family sell? Buyers know you’re desperate, so they’ll offer less than it’s worth.",
    choices: unsoldAssets().map(id => ({ t: `${cap(ASSETS[id].name)}, worth about ${peso(ASSETS[id].value)}`, ok: true, fx: () => sellOffer(id) })).concat([{ t: "Not yet", ok: true, fx: () => "" }]) });
}
function sellOffer(id) {
  const a = ASSETS[id], s = sys(), drop = Math.min(0.2, 0.05 * (s.walked || 0));
  const offer = Math.round(a.value * (0.5 + R() * 0.25 - drop) / 100) * 100;
  queue({ key: "offer", title: "The offer", icon: "🤝", fact: null,
    text: `A buyer offers ${peso(offer)} for ${a.name}. It’s worth about ${peso(a.value)}. ${a.slow ? "A sale like this takes weeks." : "He can pay within days."}`,
    choices: [
      { t: `Take ${peso(offer)}`, ok: true, fx: () => doSale(id, offer, "") },
      { t: "Haggle for a better price", ok: true, fx: () => { if (chance(0.45)) return doSale(id, Math.round(offer * 1.2 / 100) * 100, "After two weeks of haggling, he goes up. "); s.walked = (s.walked || 0) + 1; return "The buyer walks away. Word spreads that you’re selling, so the next offers will be lower."; } },
      { t: "Keep it", ok: true, fx: () => "Your family keeps it, for now." },
    ] });
  return "";
}
function doSale(id, amount, pre) {
  const a = ASSETS[id], s = sys(), wait = a.slow ? ri(30, 75) : ri(5, 14);
  s.sold.push(id); s.sales.push({ id, amount, at: S.day + wait });
  add("fam", -a.famHit);
  if (a.income) s.poorer++;
  if (a.home) s.homeSold = true;
  log(`Your family agreed to sell ${a.name} for ${peso(amount)}.`, "money");
  return `${pre}Your family agrees to sell ${a.name} for ${peso(amount)}. ${a.cost} The money should arrive in about ${wait} days.`;
}

/* borrowing */
function lenders() { const s = sys(); return Object.keys(LENDERS).filter(id => !s.asked.includes(id)); }
function queueBorrow() {
  queue({ key: "borrow", title: "Mangutang", icon: "🙏", fact: null, text: "Who will you ask? Every peso you borrow becomes a debt that follows you out.",
    choices: lenders().map(id => ({ t: LENDERS[id].t, ok: true, fx: () => borrowFrom(id) })).concat([{ t: "Not now", ok: true, fx: () => "" }]) });
}
function borrowFrom(id) {
  const L = LENDERS[id], s = sys(); s.asked.push(id); S.flags.borrow = S.day;
  if (L.chance && !chance(L.chance)) { add("hope", -2); return L.no; }
  const amt = Array.isArray(L.amt) ? ri(L.amt[0] / 100, L.amt[1] / 100) * 100 : L.amt;
  gain(amt); s.debts.push({ who: L.who, owed: amt, p: amt, rate: L.rate || 0, harass: !!L.harass, since: S.day });
  if (L.shame) add("fam", -3);
  if (L.favor) later(ri(40, 120), "favor_" + id);
  log(`You borrowed ${peso(amt)} from ${L.who}.`, "money");
  return L.yes.replace("{amt}", peso(amt));
}
function payDebts() {
  const s = sys(); let paid = 0;
  for (const d of s.debts) { if (d.owed <= 0 || S.st.cash <= 0) continue; const x = Math.min(d.owed, S.st.cash); d.owed -= x; spend(x, "other"); paid += x; }
  s.debts = s.debts.filter(d => d.owed > 0);
  return paid ? `You pay back ${peso(paid)}.${s.debts.length ? ` You still owe ${peso(totalDebt())}.` : " You’re debt-free, for now."}` : "You have nothing to pay with.";
}

/* bondsman */
function queueBondsman() {
  const b = ensureBail(), prem = Math.round(b.amt * 0.15 / 100) * 100, fee = 3000, total = prem + fee;
  const collateral = S.st.fam >= 30 || hasTitle();
  const note = b.bondOK === true ? " Your lawyer checked: the company is accredited." : b.bondOK === false ? " Your lawyer found out this company isn’t accredited." : "";
  queue({ key: "bond", title: "Bondsman", icon: "🧾", fact: null,
    text: `Outside the Hall of Justice, a man with a folder offers a surety bond from ${BONDCO}. The premium is ${peso(prem)}, plus a ${peso(fee)} “processing fee.” He wants your family’s land title or a co-maker with a steady job.${note}`,
    choices: [
      { t: `Pay ${peso(total)} and sign${collateral ? "" : " (you need collateral: Family 30 or a titled lot)"}`, ok: S.st.cash >= total && collateral && b.bondOK !== false, fx: () => takeBond(total) },
      { t: "Ask your lawyer to check the company first", ok: b.bondOK === undefined && !b.bondCheck, fx: () => { b.bondCheck = S.day + ri(14, 30); return "Your lawyer will check with the court. It takes a few weeks."; } },
      { t: "Walk away", ok: true, fx: () => "He tucks his card into your shirt pocket anyway." },
    ] });
}
function takeBond(total) {
  const b = ensureBail(); spend(total, "bail");
  if (b.bondOK !== true && chance(0.3)) { b.bondOK = false; add("hope", -8); log(`A bondsman took ${peso(total)}. The court rejected the bond.`, "bad"); return "The court rejects the bond. The company isn’t accredited, and the bondsman’s number is dead."; }
  S.flags.bondsman = true; add("fam", -8); release("bail");
  return "The court accepts the bond. You sign three copies of something you don’t fully understand. You’re released.";
}

/* ---------- contraband ---------- */
function stashValue() { const s = sys(); return s.stash.yosi * CONTRABAND.yosi.sell + s.stash.alak * CONTRABAND.alak.sell + s.stash.bold * CONTRABAND.bold.sell + s.stash.phone * CONTRABAND.phone.buy; }
function smuggleActions() {
  if (S.fac === "presinto" || (S.custody !== "detained" && S.custody !== "convict")) return [];
  const s = sys(), A = [{ id: "smug", group: "Kontrabando", t: "Order a shipment", ok: !s.ship && !(S.bart > S.day),
    why: s.ship ? "A shipment is already on the way." : "Not while you’re in the bartolina.", run: () => { queueSmuggle(); return ""; } }];
  if (stashValue() > 0) A.push({ id: "dump", group: "Kontrabando", t: "Get rid of your stash", sub: "Lowers the guards’ attention.", ok: true,
    run: () => { s.stash = { yosi: 0, alak: 0, bold: 0, phone: 0 }; s.heat = Math.max(0, s.heat - 20); return "You flush, burn, and give away what you can. The guards’ attention cools."; } });
  return A;
}
function queueSmuggle() {
  queue({ key: "smug1", title: "Kontrabando", icon: "📦", fact: "deliveries", text: "What do you want brought in? Inside, things sell for several times their price outside.",
    choices: Object.entries(CONTRABAND).map(([id, it]) => ({
      t: it.rent ? `${it.name}: ${peso(it.buy)} for one, rented out at ${peso(it.rent)} a day (pangkat members only)` : `${it.name}: ${it.qty} ${it.unit}s for ${peso(it.buy * it.qty)}, sold at ${peso(it.sell)} each`,
      ok: (!it.rent || !!S.gang) && S.st.cash >= it.buy * it.qty, fx: () => { sys().smug = { item: id }; queueChannel(); return ""; } })).concat([{ t: "Never mind", ok: true, fx: () => "" }]) });
}
function queueChannel() {
  const s = sys(), id = s.smug.item, it = CONTRABAND[id], base = it.buy * it.qty;
  queue({ key: "smug2", title: "How do you get it in?", icon: "🚪", fact: null, text: it.rent ? "Phones only come in through a guard who works with your pangkat." : "How does it get past the gate?",
    choices: Object.entries(CHANNELS).filter(([cid]) => !it.rent || cid === "bantay").map(([cid, ch]) => {
      const cost = base + (ch.fee || 0) + Math.round(base * (ch.cut || 0));
      return { t: `${ch.name} (${peso(cost)}). ${ch.desc}`, ok: S.st.cash >= cost && (!ch.req || ch.req(S)), fx: () => ship(cid, cost) };
    }).concat([{ t: "Cancel", ok: true, fx: () => { s.smug = null; return ""; } }]) });
}
function ship(channel, cost) {
  const s = sys(), id = s.smug.item, it = CONTRABAND[id];
  spend(cost, "lagay"); s.ship = { item: id, qty: it.qty, channel, at: S.day + ri(3, 10) }; s.smug = null;
  log(`You paid ${peso(cost)} to bring in ${it.name.toLowerCase()}.`, "money");
  return "It should arrive in a few days, if nobody looks too closely.";
}
function arrive() {
  const s = sys(), sh = s.ship, it = CONTRABAND[sh.item], ch = CHANNELS[sh.channel]; s.ship = null;
  if (S.custody !== "detained" && S.custody !== "convict") return;
  if (chance(clamp(ch.p - s.heat / 250, 0.1, 0.97))) { s.stash[sh.item] += sh.qty; s.heat += 4; log(`Your ${it.name.toLowerCase()} made it in.`, "money"); UI.toast(`Kontrabando: ${it.name.toLowerCase()} arrived.`); return; }
  if (sh.channel === "dalaw") { add("fam", -15); S.lock = Math.max(S.lock || 0, S.day + 60); infraction(10); info("caughtDalaw", "Your visitor got caught", "🚨", "The guards found it on your visitor. She’s banned for two months, and she cried the whole way home.", "deliveries"); }
  else if (sh.channel === "padala") { infraction(5); log("Guards found your contraband in a food delivery.", "bad"); UI.toast("Your food delivery was searched. The goods are gone."); }
  else { log("Your guard was reassigned. Your goods, and your money, went with him.", "bad"); UI.toast("The guard was reassigned. Your goods are gone."); }
}
function sellStash() {
  const s = sys(), crowd = fc().c >= 3 ? 1.2 : 0.9;
  for (const id of ["yosi", "alak", "bold"]) {
    const n = s.stash[id]; if (!n) continue;
    const it = CONTRABAND[id], d = it.demand * crowd, sold = Math.min(n, Math.floor(d) + (chance(d % 1) ? 1 : 0));
    if (!sold) continue;
    s.stash[id] -= sold; let rev = sold * it.sell;
    if (S.flags.tara) { const cut = Math.round(rev * 0.3); rev -= cut; S.tot.lagay += cut; }
    gain(rev); s.heat += sold * it.heat; S.tot.smug = (S.tot.smug || 0) + rev;
  }
  if (s.stash.phone) { const r = s.stash.phone * CONTRABAND.phone.rent * ((S.flags.jammerDown || 0) > S.day ? 2 : 1); gain(r); S.tot.smug = (S.tot.smug || 0) + r; s.heat += s.stash.phone * CONTRABAND.phone.heat; }
  s.heat = Math.max(0, s.heat * 0.97 - 0.1);
  if (s.heat > 25 && stashValue() > 0 && chance(s.heat / 3000)) queueEvent("galugad");
  if (!S.gang && s.heat > 12 && !S.flags.tara && !S.flags.taraNo && fc().gangs.length && chance(0.01)) queueEvent("tara");
}
function loseStash(caught) {
  const s = sys(), hadPhone = s.stash.phone > 0;
  s.stash = { yosi: 0, alak: 0, bold: 0, phone: 0 }; s.heat *= 0.5;
  if (caught) { infraction(15); if (hadPhone) newCase("Phones were found in your things."); }
}

/* ---------- kubol plans ---------- */
function kubolPrice(plan) { return Math.round(KUBOL_PLANS[plan].price * (S.gang ? 1 : 1.5) * (sys().hike || 1) / 50) * 50; }
function kubolActions() {
  if (S.fac !== "nbp" || S.sub === "rdc") return [];
  const k = sys().kubol;
  if (k) return [{ id: "kubolCancel", group: "Kubol", t: `Cancel your ${KUBOL_PLANS[k.plan].name} plan (${peso(k.price)} a week)`, ok: true,
    run: () => { endKubol(); return "You cancel. By evening, someone else’s curtain hangs on your kubol."; } }];
  return Object.keys(KUBOL_PLANS).map(id => {
    const p = KUBOL_PLANS[id], price = kubolPrice(id);
    return { id: "kubol_" + id, group: "Kubol", t: `Subscribe to ${p.name}: ${peso(price)} a week`, sub: `${p.desc} Paid to the guards every Monday.${S.gang ? "" : " Querna pay 50% more."}`,
      ok: S.st.cash >= price, why: `You need the first week’s ${peso(price)}.`, run: () => startKubol(id, price) };
  });
}
function startKubol(plan, price) {
  const s = sys(); spend(price, "lagay"); s.kubol = { plan, price, since: S.day }; S.pwesto = 4; refreshScene();
  log(`You subscribed to ${KUBOL_PLANS[plan].name} for ${peso(price)} a week.`, "money");
  return `Welcome to ${KUBOL_PLANS[plan].name}. Your first week is paid. “Auto-renew ’yan,” the guard says. “Every Monday.”`;
}
function endKubol(msg) { const s = sys(); s.kubol = null; if (S.pwesto === 4) S.pwesto = 3; refreshScene(); if (msg) { log(msg, "bad"); S.flags.kubolLost = true; } }

/* ---------- gang missions ---------- */
function mission(p, rep, pay, onFail, okText, failText, onOk) {
  if (chance(p)) {
    S.gangRep = Math.min(100, S.gangRep + rep); if (pay) gain(pay); add("resp", 3);
    S.tot.missions = (S.tot.missions || 0) + 1; if (onOk) onOk();
    return okText + (pay ? ` Your cut: ${peso(pay)}.` : "");
  }
  infraction(30); if (onFail) onFail(); return failText;
}
function rivalGang() { const g = fc().gangs.filter(x => x !== S.gang); return g.length ? pick(g) : (S.gang || "k13"); }

/* ---------- the release file ---------- */
function packetExtras() {
  const s = S.sys || {};
  return { debts: (s.debts || []).filter(d => d.owed > 0).map(d => ({ who: d.who, owed: Math.round(d.owed) })),
    sold: (s.sold || []).map(id => ASSETS[id].name), homeSold: !!s.homeSold, bondsman: !!S.flags.bondsman, lockupHours: S.tot.lockupHours || null };
}

/* ---------- clock hooks ---------- */
function systemsDaily() {
  const s = sys();
  if (s.sales.length) {
    for (const x of s.sales) if (x.at <= S.day) { gain(x.amount); log(`Money from selling ${ASSETS[x.id].name} arrived: ${peso(x.amount)}.`, "money"); UI.toast(`Sale money arrived: ${peso(x.amount)}.`); }
    s.sales = s.sales.filter(x => x.at > S.day);
  }
  const b = s.bail;
  if (b && b.bondCheck && S.day >= b.bondCheck) {
    b.bondCheck = null; b.bondOK = chance(0.65);
    log(b.bondOK ? "Your lawyer says the bonding company is accredited." : "Your lawyer says the bonding company isn’t accredited.", "case");
    UI.toast(b.bondOK ? "The bonding company checks out." : "The bonding company is a fake.");
  }
  if (s.ship && S.day >= s.ship.at) arrive();
  if (S.custody === "detained" || S.custody === "convict") sellStash();
  if (s.kubol && S.pwesto === 4) { const p = KUBOL_PLANS[s.kubol.plan]; add("hp", p.hp); add("hope", p.hope); }
  metaDaily();
}
function systemsWeekly() {
  const s = sys(), k = s.kubol;
  if (k) {
    if (S.fac !== "nbp" || S.pwesto !== 4) { spend(Math.min(k.price, S.st.cash), "lagay"); endKubol("Your kubol is gone, but the guards still collected this week’s payment."); }
    else if (S.st.cash >= k.price) spend(k.price, "lagay");
    else { endKubol("Your kubol payment didn’t go through. The guards gave it to someone who paid."); UI.toast("Kubol plan cancelled: payment failed."); }
  }
  if (chance(0.12)) { const x = pick(TALK); log(`${x.who}: “${x.tl}” (${x.en})${x.rumor === "wrong" ? " Likely wrong." : x.rumor ? " Rumor, unverified." : ""}`, "talk"); }
  metaWeekly();
}
function systemsMonthly() {
  const s = sys();
  for (const d of s.debts) {
    if (d.owed <= 0) continue;
    if (d.rate) d.owed = Math.min(Math.round(d.owed * (1 + d.rate)), (d.p || d.owed) * 5);
    if (d.harass && chance(0.5)) { add("fam", -5); add("hope", -4); log("The lending app texted everyone in your contacts that you’re a scammer.", "bad"); }
  }
}

/* ---------- state ---------- */
const META_KEY = "kosa-meta";
function metaLoad() {
  const base = { runs: 0, endings: {}, treasures: {}, rights: {}, kosa: {}, ach: {} };
  try { return Object.assign(base, JSON.parse(localStorage.getItem(META_KEY) || "{}")); } catch (e) { return base; }
}
function metaSave(M) { try { localStorage.setItem(META_KEY, JSON.stringify(M)); } catch (e) { /* storage may be unavailable */ } }
function meta() {
  if (!S.meta) S.meta = { boxes: 0, pity: 0, treasures: [], hearts: {}, heartEv: {}, gifts: {}, buddy: null, goals: { done: [], active: [] }, lastInf: 0, fest: {}, week: null };
  return S.meta;
}
function metaStart() {
  meta();
  const M = metaLoad(); M.runs++;
  const remembered = Object.keys(M.rights).filter(k => KNOW[k]);
  for (const k of remembered) S.know[k] = 0;
  if (remembered.length) log(`You remember ${remembered.length} ${remembered.length === 1 ? "right" : "rights"} from before. That knowledge stays with you.`, "good");
  metaSave(M);
}
function metaEnd(type) {
  const M = metaLoad(), m = meta();
  M.endings[type] = (M.endings[type] || 0) + 1;
  for (const k of Object.keys(S.know)) M.rights[k] = true;
  for (const t of m.treasures) M.treasures[t] = true;
  for (const id of Object.keys(m.hearts)) M.kosa[id] = Math.max(M.kosa[id] || 0, hearts(id));
  metaSave(M);
  achCheck(type);
}

/* ---------- friendships ---------- */
function npcsHere() { if (!S) return []; return Object.keys(NPCS).filter(id => NPCS[id].where.includes(S.fac) && (NPCS[id].sex === "*" || NPCS[id].sex === S.sex)); }
function hearts(id) { return Math.min(5, Math.floor(((S && S.meta && S.meta.hearts[id]) || 0) / 10)); }
function maxHearts() { if (!S || !S.meta) return 0; return Object.keys(S.meta.hearts).reduce((a, id) => Math.max(a, hearts(id)), 0); }
function giftReady(id) { const g = meta().gifts[id]; return g === undefined || S.day - g >= 7; }
function addHeart(id, pts) {
  if (!NPCS[id] || !S) return;
  const m = meta(), before = hearts(id);
  m.hearts[id] = Math.min(50, (m.hearts[id] || 0) + pts);
  const after = hearts(id);
  if (after > before) {
    log(`You and ${NPCS[id].name} grew closer: ${after} ${after === 1 ? "heart" : "hearts"}.`, "good");
    if (UI.celebrate) UI.celebrate("heart", `♥ ${NPCS[id].name}: ${after} ${after === 1 ? "heart" : "hearts"}`);
    if (after === 3) log(`Perk unlocked with ${NPCS[id].name}: ${NPCS[id].perk3}`, "good");
    if (after === 5) log(`Perk unlocked with ${NPCS[id].name}: ${NPCS[id].perk5}`, "good");
  }
  for (const lvl of [2, 4]) if (after >= lvl && !m.heartEv[id + lvl]) queueHeartEvent(id, lvl);
}
function queueHeartEvent(id, lvl) {
  const n = NPCS[id], ev = n["ev" + lvl]; meta().heartEv[id + lvl] = S.day;
  queue({ key: "heart_" + id + lvl, title: `${n.name}, ${lvl} hearts`, icon: "♥", who: id, fact: ev.fact || null, text: ev.t,
    choices: [{ t: "Listen", ok: true, fx: () => { add("hope", 3); if (ev.fx) ev.fx(); return ""; } }] });
}
function queueGift(id) {

  queue({ key: "gift_" + id, title: `A gift for ${n.name}`, icon: "🎁", who: id, fact: null, text: `What will you give ${n.name}? A gift they love counts more than double.`,
    choices: Object.entries(GIFTS).map(([gid, g]) => ({ t: `${g.name} (${peso(g.cost)})`, ok: S.st.cash >= g.cost, fx: () => giveGift(id, gid) })).concat([{ t: "Never mind", ok: true, fx: () => "" }]) });
}
function giveGift(id, gid) {
  const n = NPCS[id], g = GIFTS[gid], love = n.likes.includes(gid);
  spend(g.cost, "other"); meta().gifts[id] = S.day; addHeart(id, love ? 5 : 2);

/* ---------- padala ---------- */
function padalaRoll() {
  const m = meta(); m.boxes++; m.pity++;
  let tier;
  if (m.pity >= 10) tier = chance(0.25) ? "treasure" : "rare";
  else {
    const soft = Math.max(0, m.pity - 6) * 0.08, pT = RARITY.treasure.p + soft * 0.25, pR = RARITY.rare.p + soft * 0.75, r = R();
    tier = r < pT ? "treasure" : r < pT + pR ? "rare" : r < pT + pR + RARITY.uncommon.p ? "uncommon" : "common";
  }
  if (tier === "rare" || tier === "treasure") m.pity = 0;
  let pool = PADALA[tier];
  if (tier === "treasure") { const fresh = pool.filter(x => !m.treasures.includes(x.id)); if (fresh.length) pool = fresh; }
  const item = pick(pool); item.fx();
  if (tier === "treasure" && !m.treasures.includes(item.id)) m.treasures.push(item.id);
  log(`Padala, ${RARITY[tier].name.toLowerCase()}: ${item.t}.`, tier === "rare" || tier === "treasure" ? "luck" : "good");
  if (UI.padala) UI.padala(tier, item.t);
  return item;
}
function metaVisit() { padalaRoll(); }

/* ---------- goals, festivals, achievements ---------- */
function goalsFill() {
  const m = meta();
  while (m.goals.active.length < 3) {
    const g = GOALS.find(x => !m.goals.done.includes(x.id) && !m.goals.active.includes(x.id));
    if (!g) break; m.goals.active.push(g.id);
  }
}
function goalsCheck() {
  const m = meta(); goalsFill();
  for (const id of m.goals.active.slice()) {
    const g = GOALS.find(x => x.id === id); let ok = false;
    try { ok = !!(g && g.ok(S)); } catch (e) { ok = false; }
    if (!ok) continue;
    m.goals.done.push(id); m.goals.active = m.goals.active.filter(x => x !== id);
    const reward = g.r(); log(`Goal complete: ${g.t}. ${reward}.`, "luck");
    if (UI.celebrate) UI.celebrate("goal", `Goal complete: ${g.t}. ${reward}`);
  }
  goalsFill();
}
function achCheck(type) {
  const M = metaLoad(); let changed = false;
  for (const a of ACHIEVEMENTS) {
    if (M.ach[a.id]) continue;
    let ok = false; try { ok = !!a.ok(S, type || null, M); } catch (e) { ok = false; }
    if (!ok) continue;
    M.ach[a.id] = fmtDate(S.day); changed = true;
    log(`Achievement unlocked: ${a.t}.`, "luck");
    if (UI.celebrate) UI.celebrate("ach", `Achievement unlocked: ${a.t}`);
  }
  if (changed) metaSave(M);
}
function festivalCheck() {
  const d = dateOf(S.day), m = meta();
  for (const f of FESTIVALS) {
    if (f.noQueue || d.getMonth() !== f.m || d.getDate() !== f.d) continue;
    const key = f.id + d.getFullYear();
    if (!m.fest[key]) { m.fest[key] = true; queueEvent(f.id); }
  }
}
function nextFestival() {
  if (!S) return null;
  const now = dateOf(S.day), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let best = null;
  for (const f of FESTIVALS) {
    let d = new Date(today.getFullYear(), f.m, f.d);
    if (d < today) d = new Date(today.getFullYear() + 1, f.m, f.d);
    const days = Math.round((d - today) / 86400000);
    if (!best || days < best.days) best = { title: f.title, days };
  }
  return best;
}

/* ---------- clock hooks ---------- */
function metaDaily() {
  if (!S || S.ended) return;
  const m = meta();
  if (S.routine === "hangout" && m.buddy && npcsHere().includes(m.buddy) && !(S.bart > S.day)) addHeart(m.buddy, 0.35);
  for (const id of npcsHere()) { const h = hearts(id); if (h >= 3 && NPC_PERKS[id]) NPC_PERKS[id](h); }
  festivalCheck();
  if (S.day % 2 === 0) goalsCheck();
  if (S.day % 30 === 0) achCheck(null);
}
function metaWeekly() {
  const m = meta();
  if (!m.week) { m.week = { cash: S.st.cash, visits: S.tot.visits, resets: S.kaso.resets }; return; }
  const dc = S.st.cash - m.week.cash, dv = S.tot.visits - m.week.visits, dr = S.kaso.resets - m.week.resets;
  const parts = [`${dc >= 0 ? "+" : "−"}${peso(Math.abs(dc))}`];
  if (dv) parts.push(`${dv} ${dv === 1 ? "visit" : "visits"}`);
  if (dr) parts.push(`${dr} ${dr === 1 ? "reset" : "resets"}`);
  const text = `Week ${Math.floor(S.day / 7)}: ${parts.join(", ")}.`;
  log(text, "week"); if (UI.recap) UI.recap(text);
  m.week = { cash: S.st.cash, visits: S.tot.visits, resets: S.kaso.resets };
}

function estimateDaily() {
  const f = fc(), pw = PWESTO[S.pwesto] || PWESTO[1], r = ROUTINES[S.routine] || ROUTINES.rest;
  let hp = -0.02 * f.c * pw.hp + f.food + (r.hp || 0), hope = -0.04 - 0.008 * f.c * pw.hope + (r.hope || 0), cash = 0;
  if (S.food === "kantina") { hp += 0.12; cash -= 60; }

  if (S.items.fan && f.kind === "cell" && !f.bucor) cash -= 10;

UI.albumHtml = function (inGame) {
  const M = metaLoad(), m = inGame && S ? meta() : null;
  const treasures = PADALA.treasure.map(x => { const got = (m && m.treasures.includes(x.id)) || M.treasures[x.id]; return `<div class="${got ? "" : "locked"}"><b>${got ? "Found" : "Not found yet"}</b>${got ? esc(x.t) : "Something precious from home"}</div>`; }).join("");

UI.padala = function () {};

/* ---------- banners: what’s hurting or helping you, and flashes when a number moves ---------- */
const STAT_EN = { hp: "Health", hope: "Hope", cash: "Money", resp: "Respect", rec: "Record", fam: "Family" };
function conditions() {
  if (!S) return [];
  const B = [], left = v => Math.max(0, v - S.day), f = FAC[S.fac];
  if ((S.flags.tb || 0) > S.day) B.push(["tb", "bad", "😷", "TB", `−0.03 Health every day. ${left(S.flags.tb)} days of medicine left.`]);
  if ((S.flags.iso || 0) > S.day) B.push(["iso", "bad", "🚪", "Isolation", `No work, visits, or friends for ${left(S.flags.iso)} days.`]);
  if ((S.flags.sick || 0) > S.day) B.push(["sick", "bad", "🦟", "Dengue", `No work or sports for ${left(S.flags.sick)} days.`]);
  if ((S.flags.sprain || 0) > S.day) B.push(["sprain", "bad", "🦶", "Sprained ankle", `No sports for ${left(S.flags.sprain)} days.`]);
  if (S.bart > S.day) B.push(["bart", "bad", "⬛", "Bartolina", `−0.1 Health and −0.35 Hope every day for ${left(S.bart)} days.`]);
  if (S.lock > S.day) B.push(["lock", "bad", "🔒", "Lockdown", `No visits or activities outside the cell for ${left(S.lock)} days.`]);
  if (S.st.hope < 15) B.push(["lugmok", "bad", "🌧", "Lost hope", "−0.05 Health every day until Hope is back above 15."]);
  if (S.st.hp < 25) B.push(["weak", "bad", "♥", "Health critical", "Rest, eat better, or see the nurse."]);
  if (isHot() && f.kind !== "farm" && !S.items.fan && S.fac !== "presinto") B.push(["heat", "bad", "🔥", "Hot season", "−0.07 Health every day. A fan cuts that to −0.02."]);
  if (recent("noNeeds", 7)) B.push(["needs", "bad", "🧼", "No soap or water", "−1 Health and −1 Hope each week you can’t pay for them."]);
  if ((S.flags.fastJudge || 0) > S.day) B.push(["judge", "good", "⚖", "A fast judge", `Fewer resets until ${shortDate(S.flags.fastJudge)}.`]);
  if (S.food === "kantina") B.push(["kantina", "good", "🍲", "Kantina meals", "+0.12 Health every day, for ₱80 a day."]);
  if (S.items.fan && isHot()) B.push(["fan", "good", "🌀", "Electric fan", "The heat hurts less."]);

UI.renderBanners = function () {

  }
  this.condKeys = keys;
  const show = B.filter(b => b[1] === "bad").concat(B.filter(b => b[1] === "good")).slice(0, 4);
  box.innerHTML = show.map(b => `<div class="banner ${b[1]}"><b>${b[2]} ${esc(b[3])}</b><span>${esc(b[4])}</span></div>`).join("");
};
UI.announce = function (kind, title, detail) {
  this.annQ = this.annQ || [];
  if (this.annQ.length >= 3 || this.annQ.some(a => a.title === title)) return;
  this.annQ.push({ kind, title, detail });
  if (!this.annBusy) this.nextAnnounce();
};
UI.nextAnnounce = function () {
  const el = $("#announce"), a = this.annQ && this.annQ.shift();
  if (!el || !a) { this.annBusy = false; if (el) el.hidden = true; return; }
  this.annBusy = true;
  el.className = "announce " + a.kind; el.innerHTML = `<b>${esc(a.title)}</b>${a.detail ? `<span>${esc(a.detail)}</span>` : ""}`; el.hidden = false;

UI.flashStat = function (k, dir) {

  m.classList.remove("flash-up", "flash-down"); void m.offsetWidth; m.classList.add(dir < 0 ? "flash-down" : "flash-up");
  clearTimeout((this.flashT = this.flashT || {})[k]); this.flashT[k] = setTimeout(() => m.classList.remove("flash-up", "flash-down"), 2300);
};
UI.reportDay = function (before, mark, fast) {
  if (!S) return;
  const drops = [];
  for (const k of ["hp", "hope", "resp", "rec", "fam", "cash"]) { const d = S.st[k] - before[k], big = k === "cash" ? 300 : 3; if (d <= -big) drops.push(`${STAT_EN[k]} ${k === "cash" ? "−" + peso(-d) : Math.round(d)}`); }

const _showOutcome6 = UI.showOutcome;
UI.showOutcome = function (text, deltas) {

  const fmt = d => `${STAT_EN[d[0]] || d[0]} ${d[1] > 0 ? "+" : "−"}${d[0] === "cash" ? peso(Math.abs(d[1])) : Math.abs(Math.round(d[1]))}`;

const _renderLive7 = UI.renderLive;
UI.renderLive = function () {
  _renderLive7.call(this);

  const now = {}; for (const k of ["hp", "hope", "cash", "resp", "rec", "fam"]) now[k] = Math.round(S.st[k]);
  if (this.shown) for (const k in now) { const d = now[k] - this.shown[k]; if (d && (!this.speed || Math.abs(d) >= (k === "cash" ? 500 : 5))) this.flashStat(k, d); }
  this.shown = now;

/* ---------- character screen: civil status ---------- */
const _showCourt6 = UI.showCourt;

/* ---------- clicks and keys ---------- */
const markInput = () => { UI.lastInput = performance.now(); };
document.addEventListener("pointerdown", markInput, true); document.addEventListener("keydown", markInput, true); document.addEventListener("wheel", markInput, { passive: true, capture: true });
const _onClick6 = UI.onClick;
UI.onClick = function (e) {

  if (d.setroutine) { const id = d.setroutine; setWant(id); saveGame(); World.phaseKey = ""; this.renderPanel(true); this.refreshDialog(`Starting tomorrow, this is what you do every day: ${ROUTINES[id].name.toLowerCase()}.`); this.toast(`Every day now: ${ROUTINES[id].name}`); return; }
  if (d.setjob) { S.job = d.setjob; setWant("work"); saveGame(); World.phaseKey = ""; this.renderPanel(true); this.refreshDialog(`You start as ${JOBS[d.setjob].name.toLowerCase()} tomorrow. It pays ${peso(JOBS[d.setjob].pay)} a day.`); return; }
  if (d.setfood) { if (d.setfood === "kantina" && !kantinaOK()) return; S.food = d.setfood; saveGame(); this.renderPanel(true); this.refreshDialog(d.setfood === "kantina" ? "Kantina meals from now on. ₱80 a day." : "Rancho only. It’s free for a reason."); return; }
  if (d.talk) { const line = talkTo(d.talk); saveGame(); World.phaseKey = ""; this.renderLive(); this.refreshDialog(line || "You already talked today."); return; }
  if (d.hang) { meta().buddy = d.hang; setWant("hangout"); saveGame(); World.phaseKey = ""; this.renderPanel(true); this.refreshDialog(`You’ll spend your days with ${NPCS[d.hang].name}.`); return; }

document.addEventListener("keydown", e => {

window.addEventListener("resize", () => { if (UI.screen === "game" && World.vp) World.fit(); });

const _statusLines6 = statusLines;
